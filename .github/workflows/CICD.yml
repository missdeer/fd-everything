name: CICD

env:
  CICD_INTERMEDIATES_DIR: "_cicd-intermediates"
  MSRV_FEATURES: "--all-features"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - everything
    tags:
      - '*'

permissions:
  contents: read

jobs:
  crate_metadata:
    name: Extract crate metadata
    # cargo metadata only parses Cargo.toml; doesn't invoke compile_error!.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Extract crate information
      id: crate_metadata
      shell: bash
      run: |
        echo "name=fde" | tee -a $GITHUB_OUTPUT
        cargo metadata --no-deps --format-version 1 | jq -r '"version=" + .packages[0].version' | tee -a $GITHUB_OUTPUT
        cargo metadata --no-deps --format-version 1 | jq -r '"maintainer=" + .packages[0].authors[0]' | tee -a $GITHUB_OUTPUT
        cargo metadata --no-deps --format-version 1 | jq -r '"homepage=" + .packages[0].homepage' | tee -a $GITHUB_OUTPUT
        cargo metadata --no-deps --format-version 1 | jq -r '"msrv=" + .packages[0].rust_version' | tee -a $GITHUB_OUTPUT
    outputs:
      name: ${{ steps.crate_metadata.outputs.name }}
      version: ${{ steps.crate_metadata.outputs.version }}
      maintainer: ${{ steps.crate_metadata.outputs.maintainer }}
      homepage: ${{ steps.crate_metadata.outputs.homepage }}
      msrv: ${{ steps.crate_metadata.outputs.msrv }}

  ensure_cargo_fmt:
    name: Ensure 'cargo fmt' has been run
    # fmt is parse-only; runs anywhere. Kept on Windows for consistency with
    # the rest of the pipeline (fde is Windows-only — `compile_error!` rejects
    # other platforms).
    runs-on: windows-2025
    steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - run: cargo fmt -- --check

  lint_check:
    name: Ensure 'cargo clippy' has no warnings
    runs-on: windows-2025
    steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Fetch Everything SDK (headers + import libs)
      shell: pwsh
      run: |
        # build.rs links Everything{32,64,ARM,ARM64}.lib and feeds
        # Everything-SDK/include/Everything.h to bindgen, so clippy
        # (which compiles the crate) needs the SDK staged in-tree.
        $sdkDir = Join-Path $env:GITHUB_WORKSPACE "Everything-SDK"
        New-Item -ItemType Directory -Path $sdkDir -Force | Out-Null
        $sdkZip = Join-Path $env:RUNNER_TEMP "Everything-SDK.zip"
        Invoke-WebRequest -Uri "https://www.voidtools.com/Everything-SDK.zip" -OutFile $sdkZip -UseBasicParsing
        Expand-Archive -Path $sdkZip -DestinationPath $sdkDir -Force
    - run: cargo clippy --all-targets --all-features -- -Dwarnings

  min_version:
    name: Minimum supported rust version
    runs-on: windows-2025
    needs: crate_metadata
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install rust toolchain (v${{ needs.crate_metadata.outputs.msrv }})
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ needs.crate_metadata.outputs.msrv }}
        components: clippy
    - name: Install Everything (service)
      shell: pwsh
      run: |
        choco install everything --version=1.4.11032 -y --no-progress
        # Start the service so tests that touch the SDK have an index.
        Start-Service "Everything" -ErrorAction SilentlyContinue
        # The chocolatey 'everything' package installs Everything.exe but
        # strips the SDK DLLs (es.exe is also stripped — see the package
        # WARNING line). fde.exe has a load-time dependency on
        # Everything{32,64}.dll, so without them every spawn of the binary
        # aborts with STATUS_DLL_NOT_FOUND (0xC0000135) before any test
        # logic runs. The SDK is also no longer vendored in-tree, so
        # build.rs needs Everything-SDK/include/Everything.h and the
        # import libs under Everything-SDK/lib/ to compile. Fetch the
        # official SDK zip from voidtools and extract it to
        # Everything-SDK/ at the repo root, which gives us dll/, include/,
        # and lib/ all at the paths build.rs and the packaging step
        # expect. Kept outside C:\Program Files so the i686 binary is
        # not affected by WOW64 file-system redirection.
        $sdkDir = Join-Path $env:GITHUB_WORKSPACE "Everything-SDK"
        New-Item -ItemType Directory -Path $sdkDir -Force | Out-Null
        $sdkZip = Join-Path $env:RUNNER_TEMP "Everything-SDK.zip"
        Invoke-WebRequest -Uri "https://www.voidtools.com/Everything-SDK.zip" -OutFile $sdkZip -UseBasicParsing
        Expand-Archive -Path $sdkZip -DestinationPath $sdkDir -Force
        $dllDir = Join-Path $sdkDir "dll"
        Add-Content -Path $env:GITHUB_PATH -Value $dllDir
        Write-Host "Added $dllDir to PATH"
        Get-ChildItem $dllDir
    - name: Run clippy (on minimum supported rust version to prevent warnings we can't fix)
      shell: bash
      run: cargo clippy --locked --all-targets ${MSRV_FEATURES}
    - name: Run tests
      shell: bash
      run: cargo test --locked ${MSRV_FEATURES}

  build:
    name: '${{ matrix.job.target }} (${{ matrix.job.os }})'
    runs-on: ${{ matrix.job.os }}
    needs: crate_metadata
    permissions:
      id-token: write
      contents: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        job:
          # fde is Windows-only. Non-Windows targets removed per PLAN.md Phase 0.
          - { target: i686-pc-windows-msvc        , os: windows-2025                  }
          - { target: x86_64-pc-windows-gnu       , os: windows-2025                  }
          - { target: x86_64-pc-windows-msvc      , os: windows-2025                  }
          - { target: aarch64-pc-windows-msvc     , os: windows-11-arm                }
    env:
      BUILD_CMD: "cargo"
      target: ${{ matrix.job.target }}
      name: ${{ needs.crate_metadata.outputs.name }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.job.target }}
        toolchain: "stable"

    - name: Install Everything (service)
      shell: pwsh
      run: |
        # PLAN.md Phase 0: preinstall Everything >= 1.4.1, start the service.
        # voidtools provides no native ARM64 Everything.exe build, but the
        # SDK zip ships EverythingARM64.dll — stage it so the packaged
        # archive contains the matching runtime DLL.
        if ("${{ matrix.job.target }}" -notlike "aarch64-*") {
          choco install everything --version=1.4.11032 -y --no-progress
          Start-Service "Everything" -ErrorAction SilentlyContinue
        } else {
          Write-Host "Skipping Everything service install on ARM64 (no native build); staging SDK DLL only"
        }
        # The chocolatey 'everything' package installs Everything.exe but
        # strips the SDK DLLs (es.exe is also stripped — see the package
        # WARNING line). fde.exe has a load-time dependency on
        # Everything{32,64}.dll, so without them every spawn of the binary
        # aborts with STATUS_DLL_NOT_FOUND (0xC0000135) before any test
        # logic runs. The SDK is also no longer vendored in-tree, so
        # build.rs needs Everything-SDK/include/Everything.h and the
        # import libs under Everything-SDK/lib/ to compile. Fetch the
        # official SDK zip from voidtools and extract it to
        # Everything-SDK/ at the repo root, which gives us dll/, include/,
        # and lib/ all at the paths build.rs and the packaging step
        # expect. Kept outside C:\Program Files so the i686 binary is
        # not affected by WOW64 file-system redirection.
        $sdkDir = Join-Path $env:GITHUB_WORKSPACE "Everything-SDK"
        New-Item -ItemType Directory -Path $sdkDir -Force | Out-Null
        $sdkZip = Join-Path $env:RUNNER_TEMP "Everything-SDK.zip"
        Invoke-WebRequest -Uri "https://www.voidtools.com/Everything-SDK.zip" -OutFile $sdkZip -UseBasicParsing
        Expand-Archive -Path $sdkZip -DestinationPath $sdkDir -Force
        $dllDir = Join-Path $sdkDir "dll"
        Add-Content -Path $env:GITHUB_PATH -Value $dllDir
        Write-Host "Added $dllDir to PATH"
        Get-ChildItem $dllDir

    - name: Show version information (Rust, cargo)
      shell: bash
      run: |
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - name: Build
      shell: bash
      run: $BUILD_CMD build --locked --release --target="${target}"

    - name: Set binary name & path
      id: bin
      shell: bash
      run: |
        EXE_suffix=".exe"
        BIN_NAME="${name}${EXE_suffix}"
        BIN_PATH="target/${target}/release/${BIN_NAME}"
        echo "BIN_PATH=${BIN_PATH}" >> $GITHUB_OUTPUT
        echo "BIN_NAME=${BIN_NAME}" >> $GITHUB_OUTPUT

    - name: Set testing options
      id: test-options
      shell: bash
      run: |
        unset CARGO_TEST_OPTIONS
        case ${target} in
        aarch64-*)
          # No native Everything on ARM64; restrict to bin-level unit tests
          # until LegacyWalkerBackend / MockBackend cover this matrix slot.
          CARGO_TEST_OPTIONS="--bin=${name}" ;;
        esac
        echo "CARGO_TEST_OPTIONS=${CARGO_TEST_OPTIONS}" >> $GITHUB_OUTPUT

    - name: Run tests
      shell: bash
      env:
        cargo_test_options: ${{ steps.test-options.outputs.CARGO_TEST_OPTIONS}}
      run: $BUILD_CMD test --locked --target="${target}" "${cargo_test_options}"

    - name: Generate completions
      id: completions
      shell: bash
      env:
        BIN_PATH: ${{ steps.bin.outputs.BIN_PATH }}
      run: |
        # Upstream `make completions` assumes target/release/fd; this fork
        # builds target/${target}/release/fde.exe (renamed binary, cross-
        # compiled). Skip on ARM64 — even with EverythingARM64.dll staged
        # on PATH, launching the native ARM64 fde.exe from Git Bash on the
        # windows-11-arm runner aborts with exit 127 before clap runs
        # (Git Bash itself is x64 under Prism emulation). Tests pass only
        # because cargo's test binary drops the Everything import when no
        # FFI symbol is reachable from #[cfg(test)] code. The empty
        # autocomplete/ directory keeps the subsequent `cp -r autocomplete`
        # step happy.
        if [[ "${target}" == aarch64-* ]]; then
          echo "Skipping completion generation on ARM64 (fde.exe fails to launch under Git Bash)"
          mkdir -p autocomplete
          exit 0
        fi
        mkdir -p autocomplete
        "${BIN_PATH}" --gen-completions bash       > autocomplete/fde.bash
        "${BIN_PATH}" --gen-completions fish       > autocomplete/fde.fish
        "${BIN_PATH}" --gen-completions zsh        > autocomplete/_fde
        "${BIN_PATH}" --gen-completions powershell > autocomplete/_fde.ps1

    - name: Create tarball
      id: package
      shell: bash
      env:
        BIN_PATH: ${{ steps.bin.outputs.BIN_PATH }}
        version: ${{ needs.crate_metadata.outputs.version }}
      run: |
        PKG_suffix=".zip"
        PKG_BASENAME=${name}-v${version}-${target}
        PKG_NAME=${PKG_BASENAME}${PKG_suffix}
        echo "PKG_NAME=${PKG_NAME}" >> $GITHUB_OUTPUT

        PKG_STAGING="${CICD_INTERMEDIATES_DIR}/package"
        ARCHIVE_DIR="${PKG_STAGING}/${PKG_BASENAME}/"
        mkdir -p "${ARCHIVE_DIR}"

        # Binary
        cp "${BIN_PATH}" "$ARCHIVE_DIR"

        # README, LICENSE and CHANGELOG files
        cp "README.md" "LICENSE-MIT" "LICENSE-APACHE" "CHANGELOG.md" "$ARCHIVE_DIR"

        # Man page
        cp "doc/${name}.1" "$ARCHIVE_DIR" 2>/dev/null || cp "doc/fd.1" "$ARCHIVE_DIR"

        # Autocompletion files
        cp -r autocomplete "${ARCHIVE_DIR}"

        # Everything SDK runtime DLL — fde.exe has a load-time dependency on
        # Everything{32,64}.dll. Ship it alongside the binary so users don't
        # need to hunt down the voidtools SDK zip. ARM64 has no native DLL.
        SDK_DLL_DIR="${GITHUB_WORKSPACE}/Everything-SDK/dll"
        case ${target} in
        i686-*)        cp "${SDK_DLL_DIR}/Everything32.dll"  "$ARCHIVE_DIR" ;;
        x86_64-*)      cp "${SDK_DLL_DIR}/Everything64.dll"  "$ARCHIVE_DIR" ;;
        aarch64-*)     cp "${SDK_DLL_DIR}/EverythingARM64.dll" "$ARCHIVE_DIR" ;;
        esac

        # base compressed package
        pushd "${PKG_STAGING}/" >/dev/null
        7z -y a "${PKG_NAME}" "${PKG_BASENAME}"/* | tail -2
        popd >/dev/null

        echo "PKG_PATH=${PKG_STAGING}/${PKG_NAME}" >> $GITHUB_OUTPUT

    - name: "Artifact upload: tarball"
      id: upload-tarball
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ steps.package.outputs.PKG_NAME }}
        path: ${{ steps.package.outputs.PKG_PATH }}
        compression-level: 0

    - name: Check for release
      id: is-release
      shell: bash
      run: |
        unset IS_RELEASE ; if [[ $GITHUB_REF =~ ^refs/tags/v[0-9].* ]]; then IS_RELEASE='true' ; fi
        echo "IS_RELEASE=${IS_RELEASE}" >> $GITHUB_OUTPUT

    - name: "Attest artifacts"
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
      if: steps.is-release.outputs.IS_RELEASE
      with:
        subject-path: |
          ${{ steps.package.outputs.PKG_PATH }}

    - name: Publish archives and packages
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      if: steps.is-release.outputs.IS_RELEASE
      with:
        files: |
          ${{ steps.package.outputs.PKG_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # winget job intentionally removed — fde is a fork; upstream sharkdp.fd
  # identifier should not be re-published. Reintroduce under a new identifier
  # once the fork has a release cadence.
